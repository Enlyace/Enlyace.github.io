<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>保姆工资计算器</title>
    <meta name="theme-color" content="#bc5f2c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="工资计算器" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <p class="eyebrow">工资核算小工具</p>
        <h1>保姆工资计算器</h1>
        <p class="subtitle">
          按“26天工资7000元”的规则，输入结算日期和休息日期，自动算出应付工资。
        </p>
      </section>

      <section class="card install-card" id="install-card">
        <div class="install-copy">
          <p class="eyebrow">手机使用更方便</p>
          <h2>支持加到桌面</h2>
          <p id="install-text">
            安卓浏览器可直接安装到桌面；iPhone 可在 Safari 里点“共享”后选择“添加到主屏幕”。
          </p>
        </div>
        <div class="install-actions">
          <button type="button" id="install-app" class="primary" hidden>安装到手机桌面</button>
          <button type="button" id="dismiss-install" class="ghost">我知道了</button>
        </div>
      </section>

      <section class="card">
        <form id="salary-form" class="form">
          <div class="grid two-columns">
            <label class="field">
              <span>基准天数</span>
              <input id="base-days" name="baseDays" type="number" min="1" value="26" required />
            </label>

            <label class="field">
              <span>基准工资（元）</span>
              <input
                id="base-salary"
                name="baseSalary"
                type="number"
                min="0"
                step="0.01"
                value="7000"
                required
              />
            </label>
          </div>

          <div class="grid two-columns">
            <label class="field">
              <span>开始日期</span>
              <input id="start-date" name="startDate" type="date" required />
            </label>

            <label class="field">
              <span>结束日期</span>
              <input id="end-date" name="endDate" type="date" required />
            </label>
          </div>

          <label class="field">
            <span>休息日期</span>
            <textarea
              id="rest-days"
              name="restDays"
              rows="8"
              placeholder="支持以下写法：&#10;2026-01-10&#10;1月10日，11号，12号&#10;2026-01-20 ~ 2026-01-22"
            ></textarea>
            <small>
              每行可写一个日期、一组日期或一段日期范围。支持格式：`2026-01-10`、`1月10日，11号，12号`、`2026-01-10 ~ 2026-01-12`。
            </small>
          </label>

          <div class="actions">
            <button type="submit" class="primary">计算工资</button>
            <button type="button" id="fill-example" class="secondary">填入示例</button>
            <button type="button" id="clear-form" class="ghost">清空</button>
          </div>
        </form>
      </section>

      <section class="card result-card">
        <div class="result-header">
          <h2>计算结果</h2>
          <p id="formula-text">先输入信息，再点击“计算工资”。</p>
        </div>

        <div class="result-grid">
          <article class="result-item">
            <span>总天数</span>
            <strong id="total-days">0</strong>
          </article>
          <article class="result-item">
            <span>休息天数</span>
            <strong id="rest-count">0</strong>
          </article>
          <article class="result-item">
            <span>工作天数</span>
            <strong id="work-days">0</strong>
          </article>
          <article class="result-item emphasis">
            <span>应付工资</span>
            <strong id="payable-salary">¥0.00</strong>
          </article>
        </div>

        <div class="details">
          <div>
            <h3>日工资</h3>
            <p id="daily-salary">¥0.00</p>
          </div>
          <div>
            <h3>休息明细</h3>
            <p id="rest-list">暂无</p>
          </div>
        </div>

        <p id="error-message" class="error" hidden></p>
      </section>

      <section class="card history-card">
        <div class="history-header">
          <div>
            <p class="eyebrow">自动保存</p>
            <h2>历史记录</h2>
            <p id="history-summary">每次计算后会自动保存在当前手机或电脑浏览器里。</p>
          </div>
          <button type="button" id="clear-history" class="ghost">清空全部记录</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
